<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{
  --panel:#0a0a0a;--bone:#efece6;--ash:#8f8f8b;--signal:#c6362b;
  --line:rgba(239,236,230,.17);
  --sans:"Helvetica Neue",Helvetica,Arial,"Liberation Sans",sans-serif;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"DejaVu Sans Mono","Liberation Mono",monospace;
  --g:clamp(20px,4vw,64px);
  --gl:max(var(--g),env(safe-area-inset-left,0px));
  --gr:max(var(--g),env(safe-area-inset-right,0px));
  --st:env(safe-area-inset-top,0px);
  --sb:env(safe-area-inset-bottom,0px);
  --s:clamp(64px,10vw,152px);
  --vh:100vh;
}
@supports (height:100svh){:root{--vh:100svh}}
html{background:#000;color-scheme:dark;-webkit-text-size-adjust:100%;text-size-adjust:100%}
html.lock{overflow:hidden}
body{background:#000;color:var(--bone);font:400 1rem/1.5 var(--sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;text-rendering:optimizeLegibility;-webkit-tap-highlight-color:transparent}
img{display:block;width:100%;height:auto;background:var(--panel)}
::selection{background:var(--bone);color:#000}
:focus-visible{outline:2px solid var(--bone);outline-offset:4px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
.i{display:inline-block;width:.8em;height:.8em;fill:none;stroke:currentColor;stroke-width:1.4;vertical-align:-.06em}

/* micro-label: the labels of the info block and of the lightbox */
.m{font:400 .75rem/1.45 var(--mono);letter-spacing:.26em;text-transform:uppercase;color:var(--ash)}

/* the name: the site's own title style, set to span the measure, underlined in red */
h1{font-weight:500;text-transform:uppercase;letter-spacing:-.02em}
.n{text-decoration:underline;text-decoration-color:var(--signal);text-decoration-skip-ink:none}

/* image buttons */
.z{position:relative;display:block;width:100%;border:0;border-radius:0;padding:0;background:#000;color:inherit;font:inherit;appearance:none;-webkit-appearance:none;cursor:zoom-in}
.z:focus-visible{outline-offset:-8px}
.z:focus-visible::after{content:"";position:absolute;inset:4px;border:2px solid #000;pointer-events:none}

/* hero: the name, then the worn tee edge to edge */
.hero__t{container-type:inline-size;overflow-x:clip;padding:calc(var(--st) + 20px) var(--gr) 26px var(--gl)}
h1{font-size:44vw;font-size:50cqi;line-height:.8;margin-left:-.035em;padding-bottom:.1em}
h1 .n{text-decoration-thickness:.035em;text-underline-offset:.06em}

/* wide: the name on the left, the photo a viewport-high block flush right */
@media (min-width:560px) and (min-aspect-ratio:1/1){
  :root{--hero:min(var(--vh),56vw)}
  .hero{display:grid;grid-template-columns:minmax(0,1fr) var(--hero)}
  .hero__t{grid-area:1/1;display:flex;flex-direction:column;justify-content:center;padding:var(--st) var(--g) 0 var(--gl)}
  .hero__img{grid-area:1/2;min-height:var(--hero)}
  .hero__img img{position:absolute;inset:0;height:100%;object-fit:cover;object-position:50% 36%}
  h1{font-size:min(20vw,60vh - 80px);font-size:min(50cqi,60vh - 80px)}
}
@media (min-width:900px) and (min-aspect-ratio:1/1){:root{--hero:min(var(--vh),64vw)}}

/* info: the two types of the tee, material and price each, then shipping. Labels in the grey mono, values in the
   large sans. A value that is not there shows nothing: its row, a type with no values and, while every value is
   empty, the whole block are not displayed. (.e is the same thing for engines without :has(), set by the script
   at the end of the page.) */
.info{padding:var(--s) var(--gr) var(--s) var(--gl)}
.info__ab{display:grid;gap:clamp(56px,9vw,88px) var(--g)}
.info h3{margin-bottom:clamp(26px,4vw,40px);font-size:clamp(1.75rem,1.2rem + 2.6vw,3rem);font-weight:500;line-height:1.02;letter-spacing:-.02em;overflow-wrap:anywhere}
.info dl div+div{margin-top:clamp(28px,4vw,40px)}
.info dt{margin-bottom:10px}
.info dd{max-width:34em;font-size:clamp(1.25rem,1rem + 1.1vw,1.625rem);line-height:1.22;letter-spacing:-.01em;overflow-wrap:anywhere}
.info dd p+p{margin-top:.3em}
.info dd[data-info$=price]{font-size:clamp(2.25rem,1.5rem + 3.6vw,3.75rem);font-weight:500;line-height:1;letter-spacing:-.02em}
.info__s{margin-top:clamp(56px,9vw,88px)}
@media (min-width:700px){.info__ab{grid-template-columns:repeat(2,minmax(0,1fr))}}
.info h3:empty,.info .e,.info.e{display:none}
.info dl div:has(dd:empty){display:none}
.info article:not(:has([data-info]:not(:empty))){display:none}
.info:not(:has([data-info]:not(:empty))){display:none}

/* the bare grid */
.g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.g img{aspect-ratio:1;object-fit:cover;transition:opacity .35s ease}
@media (hover:hover){.g .z:hover img{opacity:.82}}
@media (max-width:700px){.g{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* the two worn photos are upright: keep the collar and the print inside the square tile */
.g .z:nth-child(2) img{object-position:50% 30%}
.g .z:nth-child(3) img{object-position:50% 10%}

/* lightbox */
.v{position:fixed;inset:0;width:100%;height:100%;max-width:none;max-height:none;border:0;padding:0;background:#000;color:var(--bone);overflow:hidden;cursor:zoom-out;overscroll-behavior:contain;touch-action:pinch-zoom}
.v.zm{touch-action:manipulation;overscroll-behavior:auto}
.v:not([open]){display:none}
.v[open]{display:block;animation:in .22s ease both}
.v::backdrop{background:#000}
.v img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000 center/contain no-repeat}
.v button,.v__n{position:absolute;z-index:1;background:#000;color:var(--bone)}
.v button{border:1px solid var(--line);cursor:pointer;min-width:46px;min-height:46px;padding:0 16px;text-indent:.26em}
#vp,#vx{font-size:1rem;text-indent:0;padding:0}
.v button:hover{border-color:var(--bone)}
.v button:focus-visible{outline-offset:-6px}
.v__c{top:calc(var(--st) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px)}
.v__n{left:calc(env(safe-area-inset-left,0px) + 12px);bottom:calc(var(--sb) + 12px);padding:14px 4px 14px 12px}
#vp{right:calc(env(safe-area-inset-right,0px) + 57px);bottom:calc(var(--sb) + 12px)}
#vx{right:calc(env(safe-area-inset-right,0px) + 12px);bottom:calc(var(--sb) + 12px)}
@keyframes in{from{opacity:0}to{opacity:1}}

/* ===== 3D mode. Everything here needs html.gl, which the gate below sets only on capable devices. ===== */
.o3{display:none}
html.gl .os{display:none}
html.gl .o3{display:block}
html.gl{
  /* --u: the unit of the hero cluster. The giant NA2 is 88u wide; the figure's slot starts 15u below its top
     and is 86u high, so the cluster is 101u high. --cx / --ct: its centre line and its top (at least 4u from
     the top edge). The bottom 96 px above the safe area stay free: the row of colour swatches and the air
     between it and the hem. */
  --u:min(1vw,calc((var(--vh) - 96px - var(--st) - var(--sb))/105));
  --cx:50vw;
  --ct:calc(var(--st) + max(4*var(--u),(var(--vh) - var(--st) - var(--sb) - 96px - 101*var(--u))/2));
}
html.gl main{touch-action:pan-y pinch-zoom}

/* The story is a column of blocks in normal flow above a stage pinned to the viewport: #hero and #stovas are
   transparent stretches of scroll, #info is the one solid plate, the grid closes the page. */
html.gl .hero{display:block;height:calc(var(--vh)*3.7)}
/* #stovas ends after the figure-as-item beat for now; with the nine photo panels on the rail it is 2.85 screens */
html.gl #stovas{height:calc(var(--vh)*1.45)}
html.gl .win,html.gl .info,html.gl .blk{position:relative;z-index:1}
html.gl .blk{background:#000}
.stage{display:contents}
html.gl .stage{display:block;position:fixed;z-index:0;top:0;left:0;width:100vw;height:var(--vh);-webkit-user-select:none;user-select:none}
html.gl #gl{position:absolute;z-index:1;top:0;left:0;width:100vw;height:100vh;height:100lvh;pointer-events:none}
html.gl .hero__t{display:contents;container-type:normal}

/* the giant NA2 behind the canvas (z 0); script moves and fades it as a sign 2 m behind the figure */
html.gl h1{position:absolute;left:calc(var(--cx) - 50*var(--u));top:var(--ct);width:calc(100*var(--u));margin:0;padding:0;font-size:calc(48*var(--u));line-height:.72;text-align:center}
html.gl h1 .n{display:block;position:relative;z-index:0;width:-moz-fit-content;width:fit-content;margin:0 auto;padding-right:.045em;letter-spacing:-.045em;text-decoration:none;transform-origin:0 0;will-change:transform,opacity}
/* the red line: a faint track, and the fill that is the loading bar */
html.gl h1 .n::before,html.gl h1 .n::after{content:"";position:absolute;left:0;right:0;top:calc(37*var(--u));height:.035em;background:var(--signal)}
html.gl h1 .n::before{opacity:.3}
html.gl h1 .n::after{transform-origin:0 50%;transform:scaleX(var(--p,0))}
html.gl.n-off h1 .n{visibility:hidden}

/* frames: empty boxes the script reads; the camera puts its subjects into them */
html.gl .fr{position:absolute;z-index:2;visibility:hidden;pointer-events:none}
.fr-hero{left:calc(var(--cx) - 33*var(--u));top:calc(var(--ct) + 15*var(--u));width:calc(66*var(--u));height:calc(86*var(--u))}
.fr-print{left:4vw;right:4vw;top:calc(var(--st) + var(--vh)*.05);bottom:calc(var(--sb) + 84px)}
.fr-side{left:4vw;right:4vw;top:calc(var(--st) + var(--vh)*.05);bottom:calc(var(--sb) + 128px)}
.fr-item{left:11vw;right:11vw;top:calc(var(--st) + var(--vh)*.09);height:calc(var(--vh)*.64)}
/* keyboard focus on the hidden range input shows as a ring round the figure */
html.gl.kf:not(.ui-off) .fr-hero{visibility:visible;outline:2px solid var(--bone);outline-offset:-2px}

/* colour swatches: two dots, no words, at the bottom centre of the stage. The pressed one carries a ring.
   Behind them the foot of the stage sinks into black, so the dots never sit on the trousers. */
.sw{position:absolute;z-index:2;left:50%;bottom:calc(var(--sb) + 12px);transform:translateX(-50%);opacity:0;visibility:hidden;transition:opacity .18s linear,visibility 0s linear .18s}
html.gl .sw{display:flex}
.sw::before{content:"";position:absolute;z-index:-1;left:50%;top:-28px;bottom:calc(-12px - var(--sb));width:100vw;transform:translateX(-50%);background:linear-gradient(rgba(0,0,0,0),#000 28px);pointer-events:none}
html.gl.rdy.sw-on .sw{opacity:1;visibility:visible;transition:opacity .18s linear,visibility 0s linear}
.sw button{position:relative;flex:none;width:44px;height:44px;border:0;border-radius:50%;padding:0;background:none;color:inherit;cursor:pointer;appearance:none;-webkit-appearance:none}
.sw button::before,.sw button::after{content:"";position:absolute;border-radius:50%}
.sw button::before{inset:11px}
.sw button::after{inset:6px;border:1px solid var(--bone);opacity:0;transition:opacity .18s linear}
.sw button[aria-pressed=true]::after{opacity:1}
#cb::before{background:#0e0e10;box-shadow:inset 0 0 0 1px var(--bone)}
#cw::before{background:#ecebe6}
.sw button:focus-visible{outline-offset:-2px}
@media (hover:hover){.sw button[aria-pressed=false]:hover::after{opacity:.45}}

/* the info plate: solid black, with soft lips above and below. While it has no values it keeps its scroll
   length and shows nothing, so the story's anchors stay where they are when the values arrive. */
html.gl .info{display:flex;flex-direction:column;justify-content:center;min-height:calc(var(--vh)*.6);padding-top:56px;padding-bottom:56px;background:#000}
html.gl .info::before,html.gl .info::after{content:"";position:absolute;left:0;right:0;height:64px;pointer-events:none}
html.gl .info::before{bottom:100%;background:linear-gradient(rgba(0,0,0,0),#000)}
html.gl .info::after{top:100%;background:linear-gradient(#000,rgba(0,0,0,0))}
html.gl .info.e{display:flex;visibility:hidden}
html.gl .info:not(:has([data-info]:not(:empty))){display:flex;visibility:hidden}

/* the grid is three across at every width */
html.gl .g{grid-template-columns:repeat(3,minmax(0,1fr))}

html.gl.rdy .stage,html.gl.rdy .win{cursor:grab}
html.gl.drag,html.gl.drag *{cursor:grabbing!important}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>

<script>
/* Two small helpers for the page itself. */
(function(){
  var d=document,root=d.documentElement,info=d.getElementById('info');
  /* Engines without :has(): mark the rows, the types and the block that have no values, so the same rules hide them. */
  function filled(n){return [].some.call(n.querySelectorAll('[data-info]'),function(x){return x.firstChild})}
  if(!(window.CSS&&CSS.supports&&CSS.supports('selector(:has(a))'))){
    [].forEach.call(info.querySelectorAll('dl div,article'),function(n){if(!filled(n)) n.className+=' e'});
    if(!filled(info)) info.className+=' e';
  }
  /* Leaving 3D mode without losing the reader's place: note which block is under a line a third of the way down
     the viewport and how far through it that line is, make the change, then bring the same block and fraction
     back under the line. A block that the plain page does not have hands over to the next one. This is the one
     scroll the page ever sets by script. */
  var BLOCKS=['#hero','#info','#stovas','.g'];
  function box(i){return d.querySelector(BLOCKS[i]).getBoundingClientRect()}
  window.__keep=function(change){
    var line=Math.round(window.innerHeight*.35),y=window.scrollY,at=-1,frac=0,end=0,i,r;
    if(y>4){
      for(i=0;i<BLOCKS.length&&at<0;i++){r=box(i);if(r.height&&r.top<=line&&r.bottom>line){at=i;frac=(line-r.top)/r.height}}
      if(at<0) end=root.scrollHeight-y;                       /* below the grid: keep the distance from the end */
    }
    change();
    if(y<=4) return;
    var to=root.scrollHeight-end;
    for(i=at;i>=0&&i<BLOCKS.length;i++){r=box(i);if(r.height){to=r.top+window.scrollY+(i===at?frac:0)*r.height-line;break}}
    window.scrollTo(0,Math.max(0,Math.round(to)));
  };
})();
</script>

<script>
(function(){
  var d=document,root=d.documentElement,v=d.getElementById('v'),vn=d.getElementById('vn'),vc=d.getElementById('vc');
  var links=[],vi=null,i=0,from=null,ts=-1e3;
  function two(n){return (n<10?'0':'')+n}
  function show(k){
    i=(k+links.length)%links.length;
    var a=links[i],t=a.querySelector('img'),n=d.createElement('img');
    n.alt=t?t.alt:'';n.width=n.height=1200;n.decoding='async';
    if(t&&t.currentSrc) n.style.backgroundImage='url("'+t.currentSrc+'")';
    n.src=a.getAttribute('data-src');
    if(vi) v.replaceChild(n,vi); else v.insertBefore(n,v.firstChild);
    vi=n;
    vn.textContent=two(i+1)+' / '+two(links.length);
    var s=d.createElement('span');s.className='sr';s.style.textTransform='none';s.textContent='. '+n.alt;vn.appendChild(s);
  }
  function open(a,ret){
    links=[].filter.call(d.querySelectorAll('button[data-src]'),function(b){return b.getClientRects().length});
    from=ret||a;show(Math.max(0,links.indexOf(a)));
    root.classList.add('lock');
    d.dispatchEvent(new CustomEvent('lb',{detail:{open:true}}));
    if(v.showModal) v.showModal(); else v.setAttribute('open','');
    vc.focus();
  }
  function done(){
    if(v.hasAttribute('open')) return;
    root.classList.remove('lock');
    if(vi){v.removeChild(vi);vi=null}
    if(from){try{from.focus({preventScroll:true})}catch(e){from.focus()}from=null}
    d.dispatchEvent(new CustomEvent('lb',{detail:{open:false}}));
  }
  window.__lb={open:open};
  function close(){
    if(!v.hasAttribute('open')) return;
    if(v.close) v.close(); else {v.removeAttribute('open');done()}
  }
  d.addEventListener('click',function(e){
    var a=e.target.closest&&e.target.closest('button[data-src]');
    if(!a||(e.detail&&e.timeStamp-ts<400)) return;
    ts=e.timeStamp;open(a);
  });
  v.addEventListener('close',done);
  if(window.visualViewport) visualViewport.addEventListener('resize',function(){v.classList.toggle('zm',visualViewport.scale>1.01)});
  v.addEventListener('click',function(e){
    var b=e.target.closest('button');
    if(b&&b.id==='vp') return show(i-1);
    if(b&&b.id==='vx') return show(i+1);
    if(!b&&e.detail&&e.timeStamp-ts<400) return;
    ts=e.timeStamp;close();
  });
  d.addEventListener('keydown',function(e){
    if(!v.hasAttribute('open')) return;
    if(e.key==='Escape'){e.preventDefault();close()}
    else if(e.key==='ArrowLeft') show(i-1);
    else if(e.key==='ArrowRight') show(i+1);
    else if(e.key==='Tab'){
      var b=v.querySelectorAll('button'),a=d.activeElement,first=b[0],last=b[b.length-1];
      if(!v.contains(a)||(!e.shiftKey&&a===last)){e.preventDefault();first.focus()}
      else if(e.shiftKey&&a===first){e.preventDefault();last.focus()}
    }
  });
})();
</script>
