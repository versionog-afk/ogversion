<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>OG VERSION</title>
<link rel="canonical" href="https://ogversion.com/merch">
<link rel="icon" href="/merch/p/01.jpg">
<meta name="theme-color" content="#000000">
<meta property="og:type" content="website">
<meta property="og:url" content="https://ogversion.com/merch">
<meta property="og:image" content="https://ogversion.com/merch/p/01.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="robots" content="noindex">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#000;height:100%}
  body{overflow-x:hidden;-webkit-tap-highlight-color:transparent}
  .g{display:grid;grid-template-columns:repeat(3,1fr);gap:0;width:100%}
  .g a{display:block;aspect-ratio:1;overflow:hidden;background:#000;outline:none}
  .g img{display:block;width:100%;height:100%;object-fit:cover;transition:opacity .35s ease}
  @media (hover:hover){.g a:hover img{opacity:.82}}
  .v{position:fixed;inset:0;display:none;background:#000;z-index:9;cursor:zoom-out}
  .v.on{display:block}
  .v img{width:100%;height:100%;object-fit:contain}
  @media (max-width:700px){.g{grid-template-columns:repeat(2,1fr)}}
  @media (prefers-reduced-motion:reduce){.g img{transition:none}}
</style>
</head>
<body>
<div class="g" id="g">
  <a href="/merch/p/01.jpg"><img src="/merch/p/01.jpg" alt="" fetchpriority="high"></a>
  <a href="/merch/p/02.jpg"><img src="/merch/p/02.jpg" alt=""></a>
  <a href="/merch/p/03.jpg"><img src="/merch/p/03.jpg" alt=""></a>
  <a href="/merch/p/04.jpg"><img src="/merch/p/04.jpg" alt="" loading="lazy"></a>
  <a href="/merch/p/05.jpg"><img src="/merch/p/05.jpg" alt="" loading="lazy"></a>
  <a href="/merch/p/06.jpg"><img src="/merch/p/06.jpg" alt="" loading="lazy"></a>
  <a href="/merch/p/07.jpg"><img src="/merch/p/07.jpg" alt="" loading="lazy"></a>
  <a href="/merch/p/08.jpg"><img src="/merch/p/08.jpg" alt="" loading="lazy"></a>
  <a href="/merch/p/09.jpg"><img src="/merch/p/09.jpg" alt="" loading="lazy"></a>
</div>
<div class="v" id="v"><img id="vi" src="" alt=""></div>
<script>
(function(){
  var v=document.getElementById('v'),vi=document.getElementById('vi');
  document.getElementById('g').addEventListener('click',function(e){
    var a=e.target.closest('a'); if(!a) return; e.preventDefault(); vi.src=a.href; v.classList.add('on');
  });
  v.addEventListener('click',function(){ v.classList.remove('on'); vi.src=''; });
  window.addEventListener('keydown',function(e){ if(e.key==='Escape'){ v.classList.remove('on'); vi.src=''; } });
})();
</script>
</body>
</html>
